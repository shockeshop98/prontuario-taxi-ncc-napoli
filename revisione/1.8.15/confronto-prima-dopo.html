 da Napoli; verificarne i presupposti specifici.","Indicazione operativa dell’autore: Da trattare con verbale amministrativo (VV).","L.R.10/2024 art.17 cc.3 e6 e art.21 cc.1 e2: trasporto di terze persone senza iscrizione, verificata presso CCIAA; fino a9posti compreso il conducente. Verificare l’iscrizione di diritto ex art.17 c.5: la sola assenza in archivio non prova un difetto del requisito. Ruolo senza limiti territoriali; revisione pendente con validità conservata fino alla notifica ex art.19 cc.3 e5.","€500–3.000, PMR€1.000 entro60giorni ex L.689/1981 art.16. Comunicazioni a CCIAA, GdF, UMC, Agenzia Entrate, INL e INPS; rapporto all’autorità ex art.17 L.689 secondo le competenze e deleghe applicabili, distinta dai destinatari delle comunicazioni. Il testo regionale indica i proventi al Comune del luogo del fatto (numerazione pubblicata “6bis.7”): l’ufficio del rapporto non si desume dai soli destinatari o dai proventi; relativo atto organizzativo non acquisito. Nessun ritiro, punto patente o sconto30% automatici."],"responsibility":"Identificare autore della condotta e soggetto obbligato; documentare la responsabilità personale.","acts":[],"close":true,"relation":false,"group":"","nccPrima":true,"reviewLabel":"Verifica NCC al08/11/2026. Fonti, adattamenti e confronto con1.8.14 nel RAPPORTO_REVISIONE_1.8.15.md.","sourceIndex":17,"sourceIndices":[17],"sourceIds":["NCC1815"],"reviewReason":"Nota VV inserita come indicazione dell’autore, fuori dalla copia. Confermati obbligo ruolo, ambito fino a9posti compreso conducente,500–3.000/PMR1.000 e comunicazioni regionali; nessuna misura CdS automatica.","reviewSources":["L21art6","LR10","L689art16","L689art17"]},"reason":"Nota VV inserita come indicazione dell’autore, fuori dalla copia. Confermati obbligo ruolo, ambito fino a9posti compreso conducente,500–3.000/PMR1.000 e comunicazioni regionali; nessuna misura CdS automatica."},{"code":"I06","before":{"code":"I06","type":"NCC","title":"Trasferimento accessorio per ospiti di struttura ricettiva","formula":"Il veicolo indicato effettuava il trasferimento degli ospiti […] da […] a […] per la struttura ricettiva […]. Collegamento al soggiorno, organizzazione e corrispettivo diretto o indiretto risultavano da […].","options":[{"label":"Autovettura NCC abusiva — presupposti verificati","text":"Adibiva l’autovettura indicata a servizio professionale NCC per il trasferimento di ospiti della struttura […], dietro corrispettivo […], senza autorizzazione efficace, secondo il riscontro dell’ufficio […]. Modalità, uso del veicolo e fonti: […].","category":"severe"}],"category":"relation","payment":["Relazione","Da qualificare","Non preimpostato","Non preimpostato","Secondo la base verificata","Nessuna misura presunta"],"ref":"CdS art.85 c.4 (se NCC senza titolo); L.21/1992 artt.3 e8; L.R.10/2024 art.13-bis, introdotto da L.R.7/2026","notes":["Art.13-bis L.R.10/2024 consente il trasferimento gratuito, accessorio e riservato ai propri ospiti, senza corrispettivo diretto o indiretto, sulle tratte connesse al soggiorno. Le agenzie usano vettori autorizzati; il pacchetto non deroga ai titoli.","Il solo trasferimento non gratuito non dimostra automaticamente tutti i presupposti dell’art.85 c.4: verificare attività professionale NCC, uso del veicolo e assenza del titolo. Selezionare relazione o ipotesi abusiva verificata; evitare duplicazione con I02 per il medesimo fatto.","Identificare categoria e uso del veicolo; per gli autobus verificare il titolo specifico e le distinte fasce N01/N12, senza trasferire la tabella dell’autovettura.","Tabella ordinaria: verificare i precedenti della stessa persona nel triennio; per la seconda violazione dell’autovettura NCC usare N03, senza duplicare il fatto."],"responsibility":"Identificare autore della condotta e soggetto obbligato; documentare la responsabilità personale.","acts":[{"id":"patente","category":"severe","title":"Solo nell’ipotesi CdS grave: patente materialmente ritirata","text":"La patente è ritirata e sarà trasmessa alla Prefettura entro cinque giorni."},{"id":"sequestro","category":"severe","title":"Solo nell’ipotesi CdS grave: sequestro e custodia eseguiti","text":"Il veicolo è sequestrato ai fini della confisca con affidamento in custodia, come da separati atti […]."}],"close":false,"relation":true,"group":""},"after":{"code":"I06","type":"NCC","title":"Trasferimento accessorio per ospiti di struttura ricettiva","formula":"Il veicolo indicato effettuava il trasferimento degli ospiti […] da […] a […] per la struttura ricettiva […]. Collegamento al soggiorno, organizzazione e corrispettivo diretto o indiretto risultavano da […].","options":[{"label":"Autovettura NCC abusiva — presupposti verificati","text":"Adibiva l’autovettura indicata a servizio professionale NCC per il trasferimento di ospiti della struttura […], dietro corrispettivo […], senza autorizzazione efficace, secondo il riscontro dell’ufficio […]. Modalità, uso del veicolo e fonti: […].","category":"severe"}],"category":"relation","payment":["Relazione","Da qualificare","Non preimpostato","Non preimpostato","Secondo la base verificata","Nessuna misura presunta"],"ref":"CdS art.85 c.4 (se NCC senza titolo); L.21/1992 artt.3 e8; L.R.10/2024 art.13-bis, introdotto da L.R.7/2026","notes":["Ambito: le disposizioni nazionali e regionali richiamate non sono limitate agli NCC autorizzati da Napoli; verificarne i presupposti specifici.","L.R.10/2024 art.13-bis: servizio gratuito anche indirettamente, accessorio, per propri ospiti e tragitti connessi al soggiorno. Il solo corrispettivo non prova un’attività professionale NCC: accertare organizzazione, veicolo, uso e titolo; autobus con disciplina distinta.","Base per relazione; scegliere l’alternativa art.85 c.4 solo per servizio professionale con autovettura senza autorizzazione efficace. €1.812–7.249, confisca e patente4–12mesi, nessun PMR. Se seconda violazione della stessa persona nel triennio, N03; revoca al Prefetto, non attestata come già disposta.","Agenzie e tour operator impiegano vettori autorizzati; il pacchetto non deroga ai titoli. Norma regionale e CdS non sono limitati agli autorizzati da Napoli. Sequestro/custodia con atti separati e patente ritirata soltanto se realmente eseguiti."],"responsibility":"Identificare autore della condotta e soggetto obbligato; documentare la responsabilità personale.","acts":[{"id":"patente","category":"severe","title":"Solo nell’ipotesi CdS grave: patente materialmente ritirata","text":"La patente è ritirata e sarà trasmessa alla Prefettura entro cinque giorni."},{"id":"sequestro","category":"severe","title":"Solo nell’ipotesi CdS grave: sequestro e custodia eseguiti","text":"Il veicolo è sequestrato ai fini della confisca con affidamento in custodia, come da separati atti […]."}],"close":false,"relation":true,"group":"","nccPrima":true,"reviewLabel":"Verifica NCC al08/11/2026. Fonti, adattamenti e confronto con1.8.14 nel RAPPORTO_REVISIONE_1.8.15.md.","sourceIndex":17,"sourceIndices":[17],"sourceIds":["NCC1815"],"reviewReason":"Tabella CdS attiva nella sola alternativa di servizio professionale con autovettura senza titolo. Base per relazione; gratuità/accessorietà, onerosità e ambito regionale distinti. Nessun art.85 c.4 desunto dal solo corrispettivo.","reviewSources":["CDS85","L21art3","L21art8","LR10","LR7","CDS202","CDS213"]},"reason":"Tabella CdS attiva nella sola alternativa di servizio professionale con autovettura senza titolo. Base per relazione; gratuità/accessorietà, onerosità e ambito regionale distinti. Nessun art.85 c.4 desunto dal solo corrispettivo."},{"code":"R02","before":{"code":"R02","type":"NCC","title":"Elenco di collaboratori e sostituti non allegato al titolo","formula":"Durante il servizio con il veicolo indicato, con autorizzazione NCC n. […], il titolo esibito non recava allegato l’elenco prescritto di collaboratori o sostituti […], come riscontrato mediante […].","options":[],"category":"tuel","payment":["Regime generale TUEL","25–500","50 entro 60 giorni","Non previsto","Rapporto ex art. 17 L.689/1981","Non previste"],"ref":"Regolamento comunale (delibera C.C. n. 80/2005), art. 6 c.4; D.Lgs.267/2000 art.7-bis; L.R.10/2024 art.21 c.5; L.689/1981 art.16","notes":["Distinguere elenco prescritto, effettiva allegazione ed esistenza della comunicazione; la mancanza dell’allegato non dimostra una persona priva dei requisiti.","Regime generale comunale: € 25–500, PMR € 50 entro 60 giorni ex art.16 L.689/1981, salvo diversa delibera di Giunta non acquisita. Art.29 c.3 comunale indica € 50: coordinamento con la successiva L.R.10/2024 art.21 c.5, non minimo edittale di € 50. Nessuno sconto 30% né punti patente.","Ambito: vetture NCC del regolamento, artt.1–2; disciplina autobus distinta."],"responsibility":"Individuare l’autore personalmente responsabile e l’eventuale obbligato in solido secondo artt.3 e6 L.689/1981. La titolarità da sola non prova l’omissione.","acts":[],"close":true,"relation":false,"group":""},"after":{"code":"R02","type":"NCC","title":"Elenco di collaboratori e sostituti non allegato al titolo","formula":"Durante il servizio con il veicolo indicato, con autorizzazione NCC n. […], il titolo esibito non recava allegato l’elenco prescritto di collaboratori o sostituti […], come riscontrato mediante […].","options":[{"label":"Utilizzo contrario a condizione dell’autorizzazione — presupposti CdS verificati","text":"Durante il servizio utilizzava l’autovettura indicata, con autorizzazione NCC n. […], senza l’elenco allegato richiesto dalla condizione […] del titolo efficace dal […]. Documento, utilizzo e riscontri: […].","category":"residual","payment":["Condizione dell’autorizzazione accertata","86–338","86","60,20","169","Nessuna accessoria CdS"]}],"category":"tuel","payment":["Regime generale TUEL","25–500","50 entro 60 giorni","Non previsto","Rapporto ex art. 17 L.689/1981","Non previste"],"ref":"CdS art.85 c.4-ter (solo nell’alternativa verificata); Regolamento comunale (delibera C.C. n. 80/2005), art. 6 c.4; D.Lgs.267/2000 art.7-bis; L.R.10/2024 art.21 c.5; L.689/1981 art.16","notes":["Ambito comunale: questi obblighi riguardano gli NCC autorizzati dal Comune di Napoli. CdS e norme nazionali o regionali hanno i propri ambiti e presupposti, anche per titoli di altri Comuni.","Art.6 c.4: elenco dei collaboratori/sostituti con dati e ruolo, da trasmettere e allegare. L’assenza della copia non dimostra mancata comunicazione, persona priva di requisiti o titolo inesistente.","Omissione comunale: €25–500, PMR €50 entro60giorni ex L.689/1981 art.16; salvo diversa delibera di Giunta non acquisita. Nessuno sconto30% o punto patente. Il rinvio dell’art.28 comunale al CdS non sostituisce i presupposti dell’art.85 c.4-ter.","Art.85 c.4-ter: accertare utilizzo del veicolo autorizzato, condizione specifica efficace del titolo e responsabilità personale; escludere i commi 4 e4-bis. La sola disposizione comunale o la titolarità non provano tali elementi. Nessun cumulo automatico per lo stesso fatto (L.689/1981 art.9).","La scelta CdS sostituisce la qualificazione base per il fatto descritto: non genera un secondo verbale TUEL automatico. Se mancano i presupposti, usare la qualificazione comunale o la relazione pertinente."],"responsibility":"Individuare l’autore personalmente responsabile e l’eventuale obbligato in solido secondo artt.3 e6 L.689/1981. La titolarità da sola non prova l’omissione.","acts":[],"close":true,"relation":false,"group":"","nccPrima":true,"reviewLabel":"Verifica NCC al08/11/2026. Fonti, adattamenti e confronto con1.8.14 nel RAPPORTO_REVISIONE_1.8.15.md.","sourceIndex":17,"sourceIndices":[17],"sourceIds":["NCC1815","REG"],"reviewReason":"TUEL base conservato: allegato mancante non prova guida non autorizzata. Aggiunta scelta4-ter solo per utilizzo, obbligo di allegazione come condizione del titolo e soggetto responsabile verificati.","reviewSources":["CDS85","REG6","L689art3"]},"reason":"TUEL base conservato: allegato mancante non prova guida non autorizzata. Aggiunta scelta4-ter solo per utilizzo, obbligo di allegazione come condizione del titolo e soggetto responsabile verificati."},{"code":"R03","before":{"code":"R03","type":"NCC","title":"Collaboratori o sostituti non comunicati al Comune","formula":"Il titolare […] dell’autorizzazione NCC n. […] impiegava il collaboratore o sostituto […] dal […] senza comunicarne i dati al Comune. Obbligo, protocollo e riscontro: […].","options":[],"category":"tuel","payment":["Regime generale TUEL","25–500","50 entro 60 giorni","Non previsto","Rapporto ex art. 17 L.689/1981","Non previste"],"ref":"Regolamento comunale (delibera C.C. n. 80/2005), art. 6 c.4; D.Lgs.267/2000 art.7-bis; L.R.10/2024 art.21 c.5; L.689/1981 art.16","notes":["Contestare al titolare per l’omissione personalmente imputabile; conducente in “altri soggetti”. Non aggiungere automaticamente ritiro o art.86/85 alla sola mancata comunicazione.","Per taxi coordinare art.7 comunale con L.R.10/2024 art.11 c.5: comunicazione e perfezionamento entro 24 ore, anziché riproporre automaticamente il precedente termine locale di 48 ore. Per NCC verificare art.6 e tipologia del rapporto.","Regime generale comunale: € 25–500, PMR € 50 entro 60 giorni ex art.16 L.689/1981, salvo diversa delibera di Giunta non acquisita. Art.29 c.3 comunale indica € 50: coordinamento con la successiva L.R.10/2024 art.21 c.5, non minimo edittale di € 50. Nessuno sconto 30% né punti patente.","Ambito: vetture NCC del regolamento, artt.1–2; disciplina autobus distinta."],"responsibility":"Individuare l’autore personalmente responsabile e l’eventuale obbligato in solido secondo artt.3 e6 L.689/1981. La titolarità da sola non prova l’omissione.","acts":[],"close":true,"relation":false,"group":""},"after":{"code":"R03","type":"NCC","title":"Collaboratori o sostituti non comunicati al Comune","formula":"Il titolare […] dell’autorizzazione NCC n. […] impiegava alla guida il collaboratore familiare […] dal […] senza trasmetterne i
